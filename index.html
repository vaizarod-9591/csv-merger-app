<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSV Merger Micro-App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; color: #333; }
    .drop-zone { border: 2px dashed #0070f3; padding: 40px; text-align: center; border-radius: 8px; background: #f9fbfd; cursor: pointer; }
    button { background: #0070f3; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 20px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: 500; }
  </style>
</head>
<body>
  <h2>Team CSV Merger</h2>
  <p>Select or drag multiple CSV files with identical headers to merge them into one file.</p>
  
  <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" multiple accept=".csv" style="display:none">
    <span>Click here or drop CSV files to upload</span>
  </div>
  
  <div id="fileList"></div>
  <button id="mergeBtn" disabled onclick="mergeAndDownload()">Merge & Download CSV</button>
  <div id="status"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const mergeBtn = document.getElementById('mergeBtn');
    const statusDiv = document.getElementById('status');
    let selectedFiles = [];

    fileInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      if (selectedFiles.length > 0) {
        mergeBtn.disabled = false;
        statusDiv.innerText = `${selectedFiles.length} file(s) selected. Ready to merge.`;
      }
    });

    async function mergeAndDownload() {
      statusDiv.innerText = "Processing files...";
      mergeBtn.disabled = true;

      let combinedData = [];
      let totalRows = 0;

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        await new Promise((resolve) => {
          Papa.parse(file, {
            header: true,
            skipEmptyLines: 'greedy',
            complete: (results) => {
              combinedData = combinedData.concat(results.data);
              totalRows += results.data.length;
              resolve();
            }
          });
        });
      }

      if (combinedData.length === 0) {
        statusDiv.innerText = "No data found across files.";
        mergeBtn.disabled = false;
        return;
      }

      // Convert combined JSON back to CSV format
      const csvOutput = Papa.unparse(combinedData);
      const blob = new Blob([csvOutput], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `merged_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      statusDiv.innerText = `✅ Successfully merged ${selectedFiles.length} files (${totalRows} total rows).`;
      mergeBtn.disabled = false;
    }
  </script>
</body>
</html>
